name: Auxiliary axial torsion clock gate
on:
  pull_request:
    paths:
      - 'research_tracks/action_selection/auxiliary_axial_clock_obstruction.*.md'
      - 'tools/verify_auxiliary_axial_torsion_clock.py'
      - 'tests/test_auxiliary_axial_torsion_clock.py'
      - '.github/workflows/auxiliary-axial-clock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-axial-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy pytest
      - name: Algebraic torsion elimination and Hamiltonian projection checks
        run: python tools/verify_auxiliary_axial_torsion_clock.py
      - name: Focused regression
        run: python -m pytest -q tests/test_auxiliary_axial_torsion_clock.py
