name: RH theta dynamics gates

on:
  pull_request:
    paths:
      - 'research_tracks/action_selection/RH_THETA_*.md'
      - 'research_tracks/action_selection/tests/test_rh_theta_*.py'
      - 'tools/verify_rh_theta_*.py'
      - '.github/workflows/rh-theta-dynamics-gates.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-representation-and-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned symbolic dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 pytest==8.4.2
      - name: Run RH theta to UBT mathematical comparators
        run: |
          python -m pytest -q \
            research_tracks/action_selection/tests/test_rh_theta_harmonic_tt_transfer_2026_11_24.py \
            research_tracks/action_selection/tests/test_rh_theta_gap_critical_pole_2026_11_24.py \
            research_tracks/action_selection/tests/test_rh_theta_ward_double_gate_2026_11_24.py \
            research_tracks/action_selection/tests/test_rh_theta_soft_universality_tt_residue_2026_11_24.py
      - name: Independent exact double-gate verifier
        run: python -B tools/verify_rh_theta_ward_double_gate_2026_11_24.py
