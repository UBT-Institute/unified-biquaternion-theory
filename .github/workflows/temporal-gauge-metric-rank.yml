name: Temporal gauge metric rank
on:
  pull_request:
    paths:
      - 'research_tracks/action_selection/temporal_gauge_metric_rank.*.md'
      - 'tools/verify_temporal_gauge_metric_rank.py'
      - 'tests/test_temporal_gauge_metric_rank.py'
      - '.github/workflows/temporal-gauge-metric-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-symbolic-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sympy pytest
      - name: Verify pointwise Jacobian rank, null rotations and projectable lapse
        run: python tools/verify_temporal_gauge_metric_rank.py
      - name: Run focused regression
        run: python -m pytest -q tests/test_temporal_gauge_metric_rank.py
