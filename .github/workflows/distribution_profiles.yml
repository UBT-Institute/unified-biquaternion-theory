name: UBT distribution profiles
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_distribution_profiles.py --out "${RUNNER_TEMP}/ubt-distributions"
      - uses: actions/upload-artifact@v4
        with:
          name: ubt-distributions
          path: ${{ runner.temp }}/ubt-distributions/UBT-*.zip
          if-no-files-found: error
