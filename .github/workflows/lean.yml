name: Lean theorem verification

on:
  pull_request:
    paths:
      - 'formal/lean/**'
      - 'tests/test_hamiltonian_restricted_jet.py'
      - '.github/workflows/lean.yml'
  push:
    branches: [master]
    paths:
      - 'formal/lean/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic validation dependencies
        run: python3 -m pip install --user pytest sympy
      - name: Restricted Hamiltonian jet symbolic and exact-number checks
        run: python3 -m pytest -q tests/test_hamiltonian_restricted_jet.py
      - uses: leanprover/lean-action@v1
        # leanchecker loads a full import environment per worker.  Mathlib's
        # environment exceeds hosted-runner memory when checked in parallel.
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: formal/lean
          build: true
          build-args: --wfail
          leanchecker: true
          leanchecker-args: UBT
          axiom-audit: true
          axiom-audit-root: UBT
