name: Lean theorem verification

on:
  pull_request:
    paths:
      - 'formal/lean/**'
      - 'tests/test_hamiltonian_restricted_jet.py'
      - 'tests/test_physics_closure.py'
      - 'tests/test_holst_selfdual_canonical_gr.py'
      - 'tests/test_holst_carrier_assumptions.py'
      - 'tests/test_holst_spin_source.py'
      - 'tools/verify_holst_spin_source.py'
      - 'tests/test_nonlinear_cartan_chart.py'
      - 'tools/verify_nonlinear_cartan_chart.py'
      - 'tests/test_spatial_constraint_closure.py'
      - 'tools/verify_spatial_constraint_closure.py'
      - 'tests/test_splitjet_spatial_dirac.py'
      - 'tools/verify_splitjet_spatial_dirac.py'
      - 'tests/test_flat_jet_torsion_action.py'
      - 'tools/verify_flat_jet_torsion_action.py'
      - 'tests/test_bare_splitjet_selection.py'
      - 'tools/verify_bare_splitjet_selection.py'
      - 'tools/verify_physics_closure.py'
      - 'tools/requirements_physics_closure.txt'
      - 'research_tracks/action_selection/physics_closure*.md'
      - '.github/workflows/lean.yml'
  push:
    branches: [master]
    paths:
      - 'formal/lean/**'
      - 'tests/test_hamiltonian_restricted_jet.py'
      - 'tests/test_physics_closure.py'
      - 'tests/test_holst_selfdual_canonical_gr.py'
      - 'tests/test_holst_carrier_assumptions.py'
      - 'tests/test_holst_spin_source.py'
      - 'tools/verify_holst_spin_source.py'
      - 'tests/test_nonlinear_cartan_chart.py'
      - 'tools/verify_nonlinear_cartan_chart.py'
      - 'tests/test_spatial_constraint_closure.py'
      - 'tools/verify_spatial_constraint_closure.py'
      - 'tests/test_splitjet_spatial_dirac.py'
      - 'tools/verify_splitjet_spatial_dirac.py'
      - 'tests/test_flat_jet_torsion_action.py'
      - 'tools/verify_flat_jet_torsion_action.py'
      - 'tests/test_bare_splitjet_selection.py'
      - 'tools/verify_bare_splitjet_selection.py'
      - 'tools/verify_physics_closure.py'
      - 'tools/requirements_physics_closure.txt'
      - 'research_tracks/action_selection/physics_closure*.md'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic validation dependencies
        run: python3 -m pip install --user -r tools/requirements_physics_closure.txt
      - name: Restricted Hamiltonian jet symbolic and exact-number checks
        run: python3 -m pytest -q tests/test_hamiltonian_restricted_jet.py
      - name: Constrained Holst Hamiltonian and independent numerical checks
        run: python3 -m pytest -q tests/test_physics_closure.py tests/test_holst_selfdual_canonical_gr.py tests/test_holst_carrier_assumptions.py tests/test_composite_palatin_holst_flrw.py tests/test_bare_splitjet_selection.py tests/test_holst_spin_source.py
      - name: Record scoped computational evidence
        run: |
          mkdir -p build/physics-closure
          python3 tools/verify_physics_closure.py > build/physics-closure/report.json
          python3 tools/verify_bare_splitjet_selection.py > build/physics-closure/bare-splitjet.json
          python3 tools/verify_holst_spin_source.py > build/physics-closure/holst-spin-source.json
          python3 tools/verify_nonlinear_cartan_chart.py > build/physics-closure/nonlinear-cartan-chart.json
          python3 tools/verify_spatial_constraint_closure.py > build/physics-closure/spatial-constraint-closure.json
          python3 tools/verify_splitjet_spatial_dirac.py > build/physics-closure/splitjet-spatial-dirac.json
          python3 tools/verify_flat_jet_torsion_action.py > build/physics-closure/flat-jet-torsion-action.json
      - name: Nonlinear Cartan chart and independent phase obstruction
        run: python3 -m pytest -q tests/test_nonlinear_cartan_chart.py
      - name: Full spatial constraint closure and independent functional bracket
        run: python3 -m pytest -q tests/test_spatial_constraint_closure.py
      - name: Split-jet spatial Dirac reduction and shared carrier momentum
        run: python3 -m pytest -q tests/test_splitjet_spatial_dirac.py
      - name: Flat jet torsion action and complete branch variation
        run: python3 -m pytest -q tests/test_flat_jet_torsion_action.py
      - uses: leanprover/lean-action@v1
        # leanchecker loads a full import environment per worker.  Mathlib's
        # environment exceeds hosted-runner memory when checked in parallel.
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: formal/lean
          build: true
          build-args: --wfail
          leanchecker: true
          leanchecker-args: UBT
          axiom-audit: true
          axiom-audit-root: UBT
      - name: Retain computational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/physics-closure/
          if-no-files-found: error
