name: UBT single-action declaration guard
on:
  push:
  pull_request:
jobs:
  action-definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check action declaration scope
        run: python tools/check_single_ubt_action.py
      - name: Exercise regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_single_ubt_action_gate.py
