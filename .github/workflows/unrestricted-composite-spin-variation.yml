name: Unrestricted composite spin variation
on:
  pull_request:
    paths:
      - 'research_tracks/action_selection/unrestricted_composite_spin_variation.*.md'
      - 'tools/verify_unrestricted_composite_spin_variation.py'
      - 'tests/test_unrestricted_composite_spin_variation.py'
      - '.github/workflows/unrestricted-composite-spin-variation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-composite-euler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install algebra packages
        run: python -m pip install sympy pytest
      - name: Verify unrestricted spin and scalar chain-rule identities
        run: python tools/verify_unrestricted_composite_spin_variation.py
      - name: Focused pytest
        run: python -m pytest -q tests/test_unrestricted_composite_spin_variation.py
